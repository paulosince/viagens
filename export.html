<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#159bf0">
  <title>Viaggio — Exportar viagem</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; color-scheme:light; }
    body { margin:0; min-height:100vh; background:#f2f2f7; color:#111; }
    main { max-width:720px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); }
    h1 { margin:0 0 8px; font-size:32px; letter-spacing:-.03em; }
    p { color:#666; line-height:1.45; }
    button { width:100%; border:0; border-radius:14px; padding:15px 18px; font:inherit; font-weight:700; background:#007aff; color:#fff; margin:12px 0; position:relative; overflow:hidden; isolation:isolate; }
    button::before { content:""; position:absolute; z-index:-1; inset:0 auto 0 0; width:var(--progress,0%); background:rgba(0,0,0,.18); transition:width .25s ease; }
    button:disabled { opacity:.85; }
    button span { position:relative; z-index:1; }
    #copy { display:none; background:#34c759; }
    #copy.visible { display:block; }
    #status { min-height:24px; font-size:14px; }
    textarea { width:100%; box-sizing:border-box; min-height:320px; border:1px solid #d1d1d6; border-radius:14px; padding:14px; background:#fff; color:#111; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; }
  </style>
</head>
<body>
  <main>
    <h1>Exportar viagem</h1>
    <p>Exportação segura e limitada dos dados acessíveis pela sua sessão. O limite evita que o navegador trave com tabelas muito grandes.</p>
    <button id="export" type="button"><span>Carregar dados</span></button>
    <button id="copy" type="button"><span>Copiar JSON</span></button>
    <p id="status" role="status"></p>
    <textarea id="output" readonly placeholder="Os dados aparecerão aqui."></textarea>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://siabldasqinpfmxslwji.supabase.co',
      'sb_publishable_UgbBIOq1TnInuPRrQpAFag_JLIzYuFf'
    );

    const button = document.querySelector('#export');
    const copyButton = document.querySelector('#copy');
    const buttonLabel = button.querySelector('span');
    const copyLabel = copyButton.querySelector('span');
    const status = document.querySelector('#status');
    const output = document.querySelector('#output');
    const failures = [];
    const LIMIT = 250;
    let exportText = '';

    function progress(label, value) {
      button.style.setProperty('--progress', value + '%');
      buttonLabel.textContent = label;
    }

    async function select(table, configure = query => query) {
      try {
        const result = await configure(supabase.from(table).select('*')).limit(LIMIT);
        if (result.error) throw new Error(result.error.message);
        return result.data || [];
      } catch (error) {
        failures.push({ table, message: error?.message || String(error) });
        return [];
      }
    }

    async function exportData() {
      if (button.disabled) return;
      button.disabled = true;
      copyButton.classList.remove('visible');
      output.value = '';
      exportText = '';
      failures.length = 0;

      try {
        progress('Verificando sessão…', 5);
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session?.user) {
          throw new Error('Nenhuma sessão encontrada. Abra o app, faça login e volte a esta página.');
        }

        progress('Carregando viagens…', 15);
        const trips = await select('trips', q => q.is('deleted_at', null).order('start_date'));
        const tripIds = trips.map(item => item.id);

        let passengers = [], days = [], checklist = [], budget = [], members = [], activities = [], locations = [];
        if (tripIds.length) {
          progress('Carregando passageiros…', 25);
          passengers = await select('passengers', q => q.in('trip_id', tripIds));
          progress('Carregando dias…', 35);
          days = await select('trip_days', q => q.in('trip_id', tripIds).order('date'));

          const dayIds = days.map(item => item.id);
          if (dayIds.length) {
            progress('Carregando atividades…', 48);
            activities = await select('activities', q => q.in('day_id', dayIds).order('starts_at'));
            progress('Carregando locais…', 60);
            locations = await select('day_locations', q => q.in('day_id', dayIds).order('position'));
          }

          progress('Carregando checklist…', 72);
          checklist = await select('checklist_items', q => q.in('trip_id', tripIds));
          progress('Carregando orçamento…', 82);
          budget = await select('budget_items', q => q.in('trip_id', tripIds));
          progress('Carregando participantes…', 90);
          members = await select('trip_members', q => q.in('trip_id', tripIds));
        }

        progress('Montando exportação…', 96);
        const exportObject = {
          exported_at: new Date().toISOString(),
          user: { id: sessionData.session.user.id, email: sessionData.session.user.email },
          trips, passengers, trip_days: days, activities, day_locations: locations,
          checklist_items: checklist, budget_items: budget, trip_members: members,
          _limits: { per_table: LIMIT, note: 'Each table is limited to 250 rows.' },
          _failures: failures
        };

        exportText = JSON.stringify(exportObject, null, 2);
        output.value = exportText;
        progress('Exportação concluída', 100);
        copyButton.classList.add('visible');
        status.textContent = failures.length
          ? 'Concluído, com falhas em: ' + failures.map(item => item.table).join(', ') + '.'
          : 'Concluído. Toque em “Copiar JSON” para copiar os dados.';
      } catch (error) {
        button.style.setProperty('--progress', '0%');
        buttonLabel.textContent = 'Tentar novamente';
        status.textContent = error?.message || String(error);
      } finally {
        button.disabled = false;
      }
    }

    async function copyExport() {
      if (!exportText) return;
      copyButton.disabled = true;
      try {
        await navigator.clipboard.writeText(exportText);
        copyLabel.textContent = 'Copiado ✓';
        status.textContent = 'JSON copiado para a área de transferência.';
      } catch {
        output.focus();
        output.select();
        status.textContent = 'Não foi possível copiar automaticamente. O texto está selecionado; toque em “Copiar”.';
      } finally {
        setTimeout(() => {
          copyButton.disabled = false;
          copyLabel.textContent = 'Copiar JSON';
        }, 1400);
      }
    }

    button.addEventListener('click', exportData);
    copyButton.addEventListener('click', copyExport);
  </script>
</body>
</html>
