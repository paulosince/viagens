<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#159bf0">
  <meta name="referrer" content="no-referrer">
  <title>Entrar no Viaggio</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #183047; background: linear-gradient(160deg,#daf5fa,#b9def3); font: 16px/1.5 system-ui,sans-serif; }
    main { width: min(100%,400px); padding: 30px 24px; background: #ffffffed; border-radius: 24px; box-shadow: 0 20px 60px #124c701a; }
    h1 { margin: 0; font-size: 36px; letter-spacing: -.04em; }
    .intro { margin: 8px 0 24px; color: #526778; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; min-height: 52px; border: 1px solid #a9bfce; border-radius: 12px; padding: 12px; font: inherit; background: white; color: #183047; }
    input:focus { outline: 3px solid #168ce240; border-color: #168ce2; }
    button { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 12px; background: #087df4; color: white; font: inherit; font-weight: 700; }
    button:disabled { opacity: .6; }
    #login-message { color: #a32828; margin: 12px 0 0; }
    .signup-link { margin: 20px 0 0; font-size: 14px; text-align: center; }
    a { color: #075db2; }
  </style>
</head>
<body>
  <main>
    <h1>Viaggio</h1>
    <p class="intro">Entre com sua conta para continuar a viagem.</p>
    <form id="login-form" name="login" method="post" action="./login.html" autocomplete="on">
      <label for="login-username">E-mail</label>
      <input id="login-username" name="username" type="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
      <label for="login-password">Senha</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
      <button id="login-submit" type="submit" disabled>Entrar</button>
      <p id="login-message" role="status" aria-live="polite"></p>
    </form>
    <p class="signup-link">Ainda não tem conta? <a href="./index.html?auth=signup">Criar conta</a></p>
    <noscript>Ative o JavaScript para entrar com segurança.</noscript>
  </main>
  <script type="module" src="./src/login-neon.mjs?v=20261115-login1"></script>
</body>
</html>
