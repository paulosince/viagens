name: Viaggio Neon Auth federation checks

on:
  push:
    branches:
      - migration/neon-app-20261019
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - '.github/workflows/viaggio-neon-auth-checks.yml'
  pull_request:
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - '.github/workflows/viaggio-neon-auth-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax verification
        run: |
          node --check experiments/neon-pilot/migration/auth/check-federation.mjs
          node --check experiments/neon-pilot/migration/auth/check-federation.test.mjs
          node --check experiments/neon-pilot/migration/auth/identity-proof-core.mjs
          node --check experiments/neon-pilot/migration/auth/identity-proof-core.test.mjs
      - name: Simulated federation security tests (no secrets)
        run: node --test experiments/neon-pilot/migration/auth/*.test.mjs
