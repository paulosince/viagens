name: Viaggio Neon Auth federation checks

on:
  push:
    branches:
      - migration/neon-app-20261019
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - 'experiments/neon-pilot/app/auth-link.html'
      - '.github/workflows/viaggio-neon-auth-checks.yml'
  pull_request:
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - '.github/workflows/viaggio-neon-auth-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax verification
        run: |
          node --check experiments/neon-pilot/migration/auth/check-federation.mjs
          node --check experiments/neon-pilot/migration/auth/check-federation.test.mjs
          node --check experiments/neon-pilot/migration/auth/identity-proof-core.mjs
          node --check experiments/neon-pilot/migration/auth/identity-proof-core.test.mjs
          node --check experiments/neon-pilot/migration/auth/trusted-auth-adapters.mjs
          node --check experiments/neon-pilot/migration/auth/trusted-auth-adapters.test.mjs
          node --check experiments/neon-pilot/migration/auth/link-orchestrator.mjs
          node --check experiments/neon-pilot/migration/auth/link-orchestrator.test.mjs
          node --check experiments/neon-pilot/migration/auth/link-store.mjs
          node --check experiments/neon-pilot/migration/auth/link-store.test.mjs
          node --check experiments/neon-pilot/migration/auth/link-service/index.mjs
          node --check experiments/neon-pilot/migration/auth/link-service/build.mjs
      - name: Validate separate account-link portal (no live passwords)
        run: |
          node -e "const fs=require('fs');const vm=require('vm');const a=fs.readFileSync('experiments/neon-pilot/app/auth-link.html','utf8');const b=a.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/); if(!b||!a.includes('sb_publishable_')||a.includes('sb_secret_'))process.exit(1);new vm.Script(b[1]); console.log('Portal syntax and public-key checks passed');"
      - name: Simulated federation security tests (no secrets)
        run: node --test experiments/neon-pilot/migration/auth/*.test.mjs
