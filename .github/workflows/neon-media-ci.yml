name: Neon media migration tests

on:
  pull_request:
    paths:
      - 'experiments/neon-pilot/functions/g3automatic/**'
      - 'experiments/neon-pilot/migrar-arquivos.html'
      - '.github/workflows/neon-media-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install laboratory dependencies
        working-directory: experiments/neon-pilot/functions/g3automatic
        run: npm install --no-audit --no-fund
      - name: Check source syntax
        working-directory: experiments/neon-pilot/functions/g3automatic
        run: |
          node --check index.mjs
          node --check media-copy.mjs
          node --check probe-core.mjs
      - name: Test transfer and fail-closed behavior
        working-directory: experiments/neon-pilot/functions/g3automatic
        run: npm test
      - name: Check standalone HTML script syntax
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const input = readFileSync('experiments/neon-pilot/migrar-arquivos.html','utf8');
          const script = input.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw Error('module script missing');
          new Function(script.replace(/^import .*\n/m, ''));
          JS
