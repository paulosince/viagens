name: Offline smoke test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'tests/**'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'tests/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: |
          node --check src/main.js
          node --check src/offline-store.js
          node --check sw.js
      - name: Verify offline sync and independent agenda photos
        run: |
          node tests/offline-sync.cjs
          node tests/day-map-order.cjs
          node tests/inline-agenda.cjs
          node tests/day-attachments.cjs
      - name: Verify offline app shell
        run: |
          test -f index.html
          test -f style.css
          test -f src/main.js
          test -f src/offline-store.js
          test -f manifest.webmanifest
          test -f assets/app-icon.svg
          test -f assets/cintia.png
          test -f supabase/migrations/20260925_ordered_trip_days.sql
          test -f supabase/migrations/20260925_change_log.sql
          test -f supabase/migrations/20260925_state_snapshots.sql
          test -f supabase/migrations/20260925_snapshot_baseline.sql
          test -f supabase/migrations/20260925_change_log_source.sql
          test -f oauth/consent/index.html
          test -f supabase/functions/viaggio-mcp/index.ts
          test -f plugins/viaggio/plugin.json
          test -f plugins/viaggio/mcp.json
          test -f plugins/viaggio/skills/viaggio/SKILL.md
