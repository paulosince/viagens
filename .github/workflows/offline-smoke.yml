name: Offline smoke test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'experiments/neon-pilot/app/**'
      - 'legacy-supabase.html'
      - 'tests/**'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'experiments/neon-pilot/app/**'
      - 'legacy-supabase.html'
      - 'tests/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: |
          node --input-type=module --check < src/main.js
          node --input-type=module --check < experiments/neon-pilot/app/main-neon.js
          node --input-type=module --check < experiments/neon-pilot/app/backend-neon.mjs
          node --input-type=module --check < experiments/neon-pilot/app/usage-rings.mjs
          node --input-type=module --check < experiments/neon-pilot/app/storage-neon.mjs
          node --input-type=module --check < experiments/neon-pilot/app/offline-store-neon.js
          node --input-type=module --check < src/update-manager-neon.js
          node --input-type=module --check < src/offline-store.js
          node --check sw.js
          node --input-type=module --check < src/update-manager.js
      - name: Verify offline sync and independent agenda photos
        run: |
          node tests/tickets-render.cjs
          node tests/ticket-cover-ios.cjs
          node tests/ticket-cover-selection.cjs
          node tests/ticket-picker-post-confirm.cjs
          node tests/offline-sync.cjs
          node tests/day-map-order.cjs
          node tests/inline-agenda.cjs
          node tests/day-attachments.cjs
          node tests/history-reset.cjs
          node tests/saved-passengers.cjs
          node tests/shared-owner-photos.cjs
          node tests/trip-sections.cjs
          node tests/neon-outbox.cjs
          node tests/usage-rings.mjs
          node --test tests/neon-usage.mjs
      - name: Verify offline app shell
        run: |
          test -f index.html
          test -f style.css
          test -f src/main.js
          test -f experiments/neon-pilot/app/main-neon.js
          test -f experiments/neon-pilot/app/backend-neon.mjs
          test -f experiments/neon-pilot/app/offline-store-neon.js
          test -f src/update-manager-neon.js
          test -f legacy-supabase.html
          test -f src/offline-store.js
          test -f src/update-manager.js
          test -f src/update-manager.css
          test -f manifest.webmanifest
          test -f assets/app-icon.svg
          test -f assets/cintia.png
          test -f supabase/migrations/20260925_ordered_trip_days.sql
          test -f supabase/migrations/20260925_change_log.sql
          test -f supabase/migrations/20260925_state_snapshots.sql
          test -f supabase/migrations/20260925_snapshot_baseline.sql
          test -f supabase/migrations/20260925_change_log_source.sql
          test -f oauth/consent/index.html
          test -f supabase/functions/viaggio-mcp/index.ts
          test -f plugins/viaggio/plugin.json
          test -f plugins/viaggio/mcp.json
          test -f plugins/viaggio/skills/viaggio/SKILL.md
