name: Viaggio staging identity-link build

on:
  push:
    branches:
      - migration/neon-app-20261019
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - '.github/workflows/viaggio-link-build-stage.yml'
  pull_request:
    branches:
      - migration/neon-app-20261019
    paths:
      - 'experiments/neon-pilot/migration/auth/**'
      - '.github/workflows/viaggio-link-build-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute account-linking tests (mock identities, no secrets)
        run: node --test experiments/neon-pilot/migration/auth/*.test.mjs
      - name: Build private Neon Function
        working-directory: experiments/neon-pilot/migration/auth/link-service
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check dist/index.mjs
          cd dist
          zip -q -j function.zip index.mjs
      - name: Upload deployable, secret-free build
        uses: actions/upload-artifact@v4
        with:
          name: viaggio-neon-link-service-zip
          path: experiments/neon-pilot/migration/auth/link-service/dist/function.zip
          retention-days: 3

      - name: Stage temporary base64 bundle for Neon deployment connector
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p experiments/neon-pilot/migration/.build
          base64 -w0 experiments/neon-pilot/migration/auth/link-service/dist/function.zip > experiments/neon-pilot/migration/.build/linkup-function.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/neon-pilot/migration/.build/linkup-function.zip.b64
          git commit -m "Temporary staging artifact for Neon connector deployment"
          git push origin HEAD:migration/linkup-stage3-check-20261021
