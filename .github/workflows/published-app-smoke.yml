name: Published app smoke test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - '.github/workflows/published-app-smoke.yml'
  workflow_dispatch:

jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact published app shell
        shell: bash
        run: |
          set -eu
          base='https://paulosince.github.io/viagens/'
          main_asset="$(grep -oE 'src/main\.js\?v=[^" ]+' index.html | head -1)"
          style_asset="$(grep -oE 'style\.css\?v=[^" ]+' index.html | head -1)"
          test -n "$main_asset" && test -n "$style_asset"
          mkdir -p /tmp/viaggio-smoke
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 "$base" -o /tmp/viaggio-smoke/index.html &&
               grep -Fq "$main_asset" /tmp/viaggio-smoke/index.html &&
               grep -Fq "$style_asset" /tmp/viaggio-smoke/index.html &&
               curl -fsSL --max-time 15 "$base$main_asset" -o /tmp/viaggio-smoke/main.js &&
               curl -fsSL --max-time 15 "$base$style_asset" -o /tmp/viaggio-smoke/style.css &&
               curl -fsSL --max-time 15 "${base}src/offline-store.js" -o /tmp/viaggio-smoke/offline-store.js &&
               cmp -s src/main.js /tmp/viaggio-smoke/main.js &&
               cmp -s style.css /tmp/viaggio-smoke/style.css &&
               cmp -s src/offline-store.js /tmp/viaggio-smoke/offline-store.js; then
              node --input-type=module --check < /tmp/viaggio-smoke/main.js
              node --input-type=module --check < /tmp/viaggio-smoke/offline-store.js
              echo "Published app matches this commit and parses as browser modules."
              exit 0
            fi
            echo "Attempt $attempt: waiting for this commit on GitHub Pages."
            sleep 5
          done
          echo 'GitHub Pages did not serve the current, parseable app shell.' >&2
          exit 1
