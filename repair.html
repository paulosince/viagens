<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atualizando Viaggio</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f5f8;color:#0b1628;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.box{text-align:center;padding:28px}.spin{width:28px;height:28px;margin:0 auto 18px;border:3px solid #d9d9de;border-top-color:#007aff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#707078}</style></head><body><div class="box"><div class="spin"></div><strong>Atualizando o Viaggio…</strong><p>Suas viagens salvas neste iPhone serão preservadas.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('viaggio-')).map(k=>caches.delete(k)))}finally{location.replace('./?fresh=20260926-23')}})();</script></body></html>
